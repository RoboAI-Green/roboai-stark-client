[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboai-stark-client"
version = "0.1.0"
description = "Python client SDK for the RoboAI Stark-width API (MSE electron-impact Stark broadening with full calculation trace)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "RoboAI Green" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
Homepage = "https://libs.roboai.fi"
Repository = "https://github.com/RoboAI-Green/roboai-stark-client"

[project.scripts]
roboai-stark = "roboai_stark_client.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
include = ["roboai_stark_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
